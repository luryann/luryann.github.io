<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{canonical}}
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="{{ogtype}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<link rel="stylesheet" href="{{root}}assets/site.css">
<script>
  // Applied before first paint so the page never flashes the wrong theme.
  try {
    var t = localStorage.getItem("rl-theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
{{jsonld}}
</head>
<body>
<div class="wrap">

  <header class="site-head">
    <div>
      <div class="title-row">
        <h1><a href="{{root}}index.html" style="text-decoration:none">ryan lu</a><span class="caret" aria-hidden="true"></span></h1>
        <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle light or dark theme">[dark]</button>
      </div>
      <div class="rule" aria-hidden="true">========================================================================</div>
    </div>
    <nav aria-label="Sections">
{{nav}}
    </nav>
  </header>

  <main>
{{heading}}{{content}}
  </main>

  <footer>
    <div class="rule rule--foot" aria-hidden="true">------------------------------------------------------------------------</div>
    <div class="meta">
      <span>Los Angeles, <span data-la-time>--:--</span></span>
      <span>Updated {{updated}}</span>
      <a href="{{root}}privacy.html">privacy</a>
    </div>
  </footer>

</div>
<script src="{{root}}assets/site.js" defer></script>
</body>
</html>
